<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#286b58" />
    <title>词间 · Wordroom</title>
    <meta name="description" content="导入 CSV 词表，随机翻卡与抽词造句。" />
    <link rel="stylesheet" href="./wordroom.css" />
  </head>
  <body>
    <header>
      <div class="brand">
        <div class="logo">✦</div>
        <div>
          <b>词间 · Wordroom</b><small>把你的词表，变成今天的练习</small>
        </div>
      </div>
      <div class="header-actions">
        <div class="count"><span id="count">6</span> 个单词</div>
        <button
          id="exportBtn"
          class="btn alt export-btn"
          type="button"
          disabled
        >
          ↓ 导出星标（0）
        </button>
      </div>
    </header>
    <main class="layout">
      <aside class="side">
        <section class="panel">
          <h2>▣ 导入词表</h2>
          <button id="drop" class="drop" type="button">
            <span class="upload-icon">↥</span><strong>拖入 CSV 文件</strong
            ><span class="muted">或点击选择 · 首行为列名 · 最大 5 MB</span>
          </button>
          <input id="fileInput" type="file" accept=".csv,text/csv" hidden />
          <div id="filename" class="file">✓ 示例词库.csv</div>
          <p id="message" class="message" role="status" aria-live="polite"></p>
        </section>
        <section class="panel">
          <h2>CSV 里有什么？</h2>
          <p class="muted">勾选文件包含的内容，再指定对应列。单词为必选。</p>
          <div class="checks">
            <label
              ><input type="checkbox" checked disabled /> 单词（必选）</label
            >
            <label
              ><input type="checkbox" data-include="meaning" checked />
              释义</label
            >
            <label
              ><input type="checkbox" data-include="example" checked />
              例句</label
            >
            <label
              ><input type="checkbox" data-include="phrase" checked />
              搭配词组</label
            >
          </div>
          <div id="mapping"></div>
        </section>
      </aside>
      <section class="workspace">
        <div class="tabs">
          <div class="tabset">
            <button id="cardsTab" class="active" type="button">
              ▣ 随机卡片</button
            ><button id="drawTab" type="button">⤨ 抽词练习</button>
          </div>
          <button id="shuffleBtn" class="btn alt" type="button">
            ⤨ 重新洗牌
          </button>
        </div>
        <div id="cardsView">
          <div class="progressline">
            <b>今日复习</b><span id="position"></span>
          </div>
          <div class="bar"><i id="progress"></i></div>
          <div class="card-shell">
            <button id="card" class="card" type="button"></button>
            <button
              id="cardStar"
              class="star-btn card-star"
              type="button"
              aria-label="给当前单词加星标"
              disabled
            >
              ☆
            </button>
          </div>
          <div class="nav">
            <button id="prev" class="btn alt" type="button">← 上一个</button
            ><button id="flip" class="btn alt" type="button">↻ 翻面</button
            ><button id="next" class="btn" type="button">下一个 →</button>
          </div>
          <p class="muted center">点击卡片翻面 · 每次洗牌都会生成新的顺序</p>
        </div>
        <div id="drawView" class="hide">
          <div class="drawhead">
            <div>
              <h2>随机抽取一组词</h2>
              <span class="muted"
                >不看答案，试着为每个词写一个自己的例句。</span
              >
            </div>
            <div class="drawcontrols">
              <label for="drawCount">抽取</label
              ><input
                id="drawCount"
                type="number"
                min="1"
                value="3"
                inputmode="numeric"
              /><span>个词</span
              ><button id="drawBtn" class="btn" type="button">
                ⤨ 重新抽取
              </button>
            </div>
          </div>
          <div id="drawGrid" class="grid"></div>
        </div>
      </section>
    </main>
    <script type="module" src="./wordroom.js"></script>
  </body>
</html>
